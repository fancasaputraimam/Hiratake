# ============================================================
#  nginx reverse proxy + TLS untuk Hiratake
#  Pasang:
#    sudo cp deploy/nginx-hiratake.conf /etc/nginx/sites-available/hiratake
#    sudo ln -s /etc/nginx/sites-available/hiratake /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#  TLS gratis (isi domain dulu di bawah):
#    sudo certbot --nginx -d domain-anda.com -d www.domain-anda.com
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name domain-anda.com www.domain-anda.com;   # <-- GANTI

    # certbot akan menambahkan blok redirect ke https di sini otomatis
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name domain-anda.com www.domain-anda.com;   # <-- GANTI

    # Sertifikat diisi otomatis oleh certbot:
    # ssl_certificate     /etc/letsencrypt/live/domain-anda.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/domain-anda.com/privkey.pem;

    client_max_body_size 12M;          # cukup untuk foto selfie absensi
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Header keamanan dasar
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # File statis di-cache lama (nama file berubah saat build)
    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
