services:
  hiratake:
    build: .
    container_name: hiratake
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # hanya lokal; nginx yang buka ke internet
    volumes:
      - ./data:/app/data        # database + backup ikut selamat saat container diganti
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DB_FILE: data/hiratake.sqlite
      BACKUP_DIR: data/backup
      BACKUP_SIMPAN: 14
      BACKUP_JAM: 24
      AUTO_MIGRASI: 1
      AUTO_SEED: 1
